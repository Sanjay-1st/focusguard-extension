<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --primary: #3498db;
            --danger: #e74c3c;
            --bg: #f4f6f8;
            --card: #ffffff;
            --text: #2c3e50;
        }

        body {
            width: 320px;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: #fff;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h3 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            cursor: pointer;
            color: #7f8c8d;
            background: none;
            border: none;
            padding: 5px;
        }

        .settings-btn:hover {
            color: var(--primary);
        }

        .container {
            padding: 15px;
        }

        .input-wrapper {
            background: #fff;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 12px;
            display: flex;
        }

        input {
            flex: 1;
            padding: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-limit {
            background-color: #f39c12;
        }

        .btn-block {
            background-color: var(--danger);
        }

        .list-header {
            font-size: 12px;
            color: #95a5a6;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            background: var(--card);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        li {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        li:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <header>
        <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            FocusGuard
        </h3>
        <button id="openOptions" class="settings-btn" title="Open Dashboard">
            <svg width="20" height="20" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" stroke-width="3"
                stroke="#000000" fill="none">
                <path
                    d="M45,14.67l-2.76,2a1,1,0,0,1-1,.11L37.65,15.3a1,1,0,0,1-.61-.76l-.66-3.77a1,1,0,0,0-1-.84H30.52a1,1,0,0,0-1,.77l-.93,3.72a1,1,0,0,1-.53.65l-3.3,1.66a1,1,0,0,1-1-.08l-3-2.13a1,1,0,0,0-1.31.12l-3.65,3.74a1,1,0,0,0-.13,1.26l1.87,2.88a1,1,0,0,1,.1.89L16.34,27a1,1,0,0,1-.68.63l-3.85,1.06a1,1,0,0,0-.74,1v4.74a1,1,0,0,0,.8,1l3.9.8a1,1,0,0,1,.72.57l1.42,3.15a1,1,0,0,1-.05.92l-2.13,3.63a1,1,0,0,0,.17,1.24L19.32,49a1,1,0,0,0,1.29.09L23.49,47a1,1,0,0,1,1-.1l3.74,1.67a1,1,0,0,1,.59.75l.66,3.79a1,1,0,0,0,1,.84h4.89a1,1,0,0,0,1-.86l.58-4a1,1,0,0,1,.58-.77l3.58-1.62a1,1,0,0,1,1,.09l3.14,2.12a1,1,0,0,0,1.3-.15L50,45.06a1,1,0,0,0,.09-1.27l-2.08-3a1,1,0,0,1-.09-1l1.48-3.43a1,1,0,0,1,.71-.59L53.77,35a1,1,0,0,0,.8-1V29.42a1,1,0,0,0-.8-1l-3.72-.78a1,1,0,0,1-.73-.62l-1.45-3.65a1,1,0,0,1,.11-.94l2.15-3.14A1,1,0,0,0,50,18l-3.71-3.25A1,1,0,0,0,45,14.67Z" />
                <circle cx="32.82" cy="31.94" r="9.94" />
            </svg>
        </button>
    </header>

    <div class="container">
        <div class="input-wrapper">
            <input type="text" id="siteInput" placeholder="Detecting URL...">
        </div>

        <div class="btn-group">
            <button id="addLimit" class="btn btn-limit">5m Limit</button>
            <button id="addBlock" class="btn btn-block">Block</button>
        </div>

        <div class="list-header">Quick List</div>
        <ul id="siteList"></ul>
    </div>

    <script src="popup.js"></script>
</body>

</html>
